services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ghp
      POSTGRES_PASSWORD: ghp
      POSTGRES_DB: ghp_shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghp -d ghp_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/ghp-golang-framework/url-shortener:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://ghp:ghp@postgres:5432/ghp_shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      ADDR: ":8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Public HTTPS URL without an account: `docker compose --profile public up -d`
  # then `docker compose logs tunnel | grep trycloudflare.com`.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app

volumes:
  postgres_data:
