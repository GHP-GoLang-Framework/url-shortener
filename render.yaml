# One-click deploy on Render (free plan): Dashboard → New → Blueprint →
# pick this repository. Creates the web service, Postgres and Key Value (Redis).
services:
  - type: web
    name: ghp-url-shortener
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ADDR
        value: ":10000"
      - key: DATABASE_URL
        fromDatabase:
          name: ghp-url-shortener-db
          property: connectionString
      - key: REDIS_ADDR
        fromService:
          type: keyvalue
          name: ghp-url-shortener-cache
          property: hostport

  - type: keyvalue
    name: ghp-url-shortener-cache
    plan: free
    ipAllowList: []

databases:
  - name: ghp-url-shortener-db
    plan: free
    databaseName: ghp_shortener
    user: ghp
